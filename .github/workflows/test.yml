name: Discord Time Signal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: requestsをインストール
        run: pip install requests
      - name: Discordへ投稿
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python post.py
      - name: 前回の投稿を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_message.txt
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Update last message"
            git push
          fi
