name: Discord Bot Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: requestsをインストール
        run: pip install requests
      - name: Discordへ投稿
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python post.py
